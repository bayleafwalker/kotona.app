name: readiness maintenance preparation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format-reviewed-records:
    if: >-
      github.repository == 'bayleafwalker/kotona.app' &&
      github.event.pull_request.number == 25 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'content/agent-systems-readiness-2026-10-12'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - name: Format only the two reviewed project records
        run: |
          npm ci --ignore-scripts
          npx --no-install prettier --write \
            src/content/projects/contract-first-box.md \
            src/content/projects/gitops-cluster.md
          npm run check:content-freshness
          git diff --stat
      - name: Commit only allowed formatting changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const allowed = new Set([
            'src/content/projects/contract-first-box.md',
            'src/content/projects/gitops-cluster.md',
          ]);
          const changed = execFileSync('git', ['diff', '--name-only', '-z'], { encoding: 'utf8' })
            .split('\0').filter(Boolean);
          if (changed.some((file) => !allowed.has(file))) {
            throw new Error('Refusing changes outside the two reviewed records');
          }
          if (changed.length === 0) process.exit(0);
          execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
          execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
          execFileSync('git', ['add', '--', ...changed]);
          execFileSync('git', ['commit', '-m', 'style: format the reviewed project records'], { stdio: 'inherit' });
          const authorization = Buffer.from(`x-access-token:${process.env.GH_TOKEN}`).toString('base64');
          execFileSync('git', ['-c', `http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}`,
            'push', 'origin', 'HEAD:refs/heads/content/agent-systems-readiness-2026-10-12'], { stdio: 'inherit' });
          NODE
