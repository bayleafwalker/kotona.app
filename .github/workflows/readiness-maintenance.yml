name: readiness maintenance preparation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  map-clearance:
    if: >-
      github.repository == 'bayleafwalker/kotona.app' &&
      github.event.pull_request.number == 25 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'content/agent-systems-readiness-2026-10-12'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply the reviewed heading and viewBox adjustment
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src/components/KnowledgeMap.astro';
          const source = readFileSync(path, 'utf8');
          const previous = /  \/\/ The Vuoro node sits at y=19,[\s\S]*?  "agents-assurance": -26, \/\/ labelY coordinate/;
          if (!previous.test(source) || !source.includes('viewBox="0 -40 1000 660"')) {
            throw new Error('Map layout differs from the reviewed revision');
          }
          const replacement = [
            '  // The fourth agent ring reaches y=-15, with Vuoro\'s label at y=-27.',
            '  // Keep the two-line heading above it with deliberate clearance. The',
            '  // viewBox reserves extra top margin rather than clipping the heading;',
            '  // browser tests measure actual label clearance at each supported width.',
            '  "agents-assurance": -64, // labelY coordinate',
          ].join('\n');
          writeFileSync(path, source.replace(previous, replacement)
            .replace('viewBox="0 -40 1000 660"', 'viewBox="0 -84 1000 704"'));
          NODE
          npm ci --ignore-scripts
          npx --no-install prettier --write src/components/KnowledgeMap.astro
          node --test tests/knowledge-map.test.mjs
          git diff --stat
      - name: Commit only the reviewed map correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const allowed = 'src/components/KnowledgeMap.astro';
          const changed = execFileSync('git', ['diff', '--name-only', '-z'], { encoding: 'utf8' })
            .split('\0').filter(Boolean);
          if (changed.length !== 1 || changed[0] !== allowed) {
            throw new Error('Refusing changes outside the reviewed map correction');
          }
          execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
          execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
          execFileSync('git', ['add', '--', allowed]);
          execFileSync('git', ['commit', '-m', 'fix: reserve map heading clearance for the expanded agent territory'], { stdio: 'inherit' });
          const authorization = Buffer.from(`x-access-token:${process.env.GH_TOKEN}`).toString('base64');
          execFileSync('git', ['-c', `http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}`,
            'push', 'origin', 'HEAD:refs/heads/content/agent-systems-readiness-2026-10-12'], { stdio: 'inherit' });
          NODE
