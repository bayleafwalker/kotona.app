name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read pinned Decimal Iron revision
        id: decimal
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const trace = JSON.parse(fs.readFileSync("src/data/exhibits/decimal-iron-replay.json", "utf8"));
            const revision = trace.implementation.revision;
            if (!/^[a-f0-9]{40}$/.test(revision)) throw new Error("An immutable upstream revision is required");
            console.log(`revision=${revision}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Decimal Iron implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: bayleafwalker/decimal-iron
          ref: ${{ steps.decimal.outputs.revision }}
          path: temp/decimal-iron

      - name: Regenerate and compare Decimal Iron trace
        working-directory: temp/decimal-iron
        run: python -m decimal_iron replay --check "$GITHUB_WORKSPACE/src/data/exhibits/decimal-iron-replay.json"

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Project freshness policy
        run: npm run check:content-freshness

      - name: Generated content shape
        run: npm run check:content-shape

      - name: Explore-prompt corpus checks
        run: npm run check:explore-prompts

      - name: Agent-skills index digest drift
        run: npm run check:agent-skills

      - name: Exhibit implementation and fixture bindings
        run: npm run check:exhibits

      - name: Type, content, and editorial-role checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Worker integration smoke test
        run: npm run test:worker

      - name: Public-corpus retrieval evaluation
        run: npm run test:retrieval

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser presentation tests
        run: npm run test:browser

      - name: Retain browser review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-review
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
