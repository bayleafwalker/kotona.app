name: readiness publication verification

on:
  push:
    branches: [content/agent-systems-readiness-2026-10-12]
    paths: [.github/workflows/readiness-publication-check.yml]

permissions:
  contents: read

jobs:
  verify-publication:
    if: github.repository == 'bayleafwalker/kotona.app'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the public deployed revision and representations
        run: |
          python3 - <<'PY'
          import json
          import re
          import time
          import urllib.request

          revision = 'c0e8f030fd7dc3d3af63196f657cc15986967c24'
          slug = 'agent-systems-what-is-ready-to-rely-on'
          origin = 'https://kotona.app'
          title = 'Agent systems: what is ready to rely on'

          def fetch(path):
              request = urllib.request.Request(
                  f'{origin}{path}?verify={revision}',
                  headers={'User-Agent': 'Kotona-publication-verification/1.0'},
              )
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read().decode('utf-8')
                          print(f'HTTP {response.status}: {path}')
                          return body
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(5)

          version = json.loads(fetch('/version.json'))
          assert version['revision'] == revision, version
          print(f'PASS deployed revision {revision}')

          page = fetch(f'/notes/{slug}/')
          assert title in page, 'Published HTML title is missing'
          for number in range(1, 11):
              anchor = f'as-{number:02}'
              assert re.search(r'id=[\"\x27]' + anchor + r'[\"\x27]', page), anchor
          print('PASS HTML title and all ten stable capability anchors')

          markdown = fetch(f'/notes/{slug}.md')
          assert title in markdown, 'Markdown title is missing'
          assert 'AS-10: Evidence continuity across runner replacement' in markdown
          assert 'where-agent-tooling-fits' in markdown
          print('PASS public Markdown with the final record and companion map link')

          index = json.loads(fetch('/reference-index.json'))
          records = [document for document in index['documents']
                     if document['url'].rstrip('/') == f'{origin}/notes/{slug}']
          assert len(records) == 1, f'Expected one discovery record, found {len(records)}'
          print('PASS exactly one public reference-index entry')
          PY
