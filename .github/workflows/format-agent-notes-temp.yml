name: one-off note formatting
on:
  push:
    branches:
      - notes/2026-10-25-agent-decisions-evidence
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: notes/2026-10-25-agent-decisions-evidence
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/content/notes/the-next-outctl-experiment-should-not-use-outctl.md
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/notes/the-next-outctl-experiment-should-not-use-outctl.md
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m 'style: format Outctl note'
            git push origin HEAD:notes/2026-10-25-agent-decisions-evidence
          fi
